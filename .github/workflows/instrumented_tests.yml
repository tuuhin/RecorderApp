name: Android Instrumented Tests

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:

permissions:
    contents: read
    checks: write
    pull-requests: write

concurrency:
    group: instrumented-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    instrumented-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        strategy:
            fail-fast: false
            matrix:
                api-level: [ 36 ]
                target: [ google_apis ]
                arch: [ x86_64 ]

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Set up Gradle (with caching)
                uses: gradle/actions/setup-gradle@v4

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Configure Gradle memory
                run: |
                    mkdir -p ~/.gradle
                    echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties
                    echo "org.gradle.daemon=true" >> ~/.gradle/gradle.properties

            -   name: Enable KVM
                run: |
                    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                    sudo udevadm control --reload-rules
                    sudo udevadm trigger --name-match=kvm

            -   name: Install dependencies for test assets
                run: |
                    sudo apt-get update
                    sudo apt-get install -y ffmpeg jq

            -   name: Build test assets
                run: |
                    chmod +x data/visualizer/test_assets_builder.sh
                    OUTPUT_DIR="data/visualizer/src/androidTest/assets" ./data/visualizer/test_assets_builder.sh

            -   name: AVD cache
                uses: actions/cache@v4
                id: avd-cache
                with:
                    path: |
                        ~/.android/avd/*
                        ~/.android/adb*
                    key: avd-v1-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}

            -   name: Create AVD and generate snapshot for caching
                if: steps.avd-cache.outputs.cache-hit != 'true'
                uses: reactivecircus/android-emulator-runner@v2
                with:
                    api-level: ${{ matrix.api-level }}
                    target: ${{ matrix.target }}
                    arch: ${{ matrix.arch }}
                    force-avd-creation: false
                    emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                    disable-animations: false
                    script: echo "Generated AVD snapshot for caching."

            -   name: Run instrumented tests
                uses: reactivecircus/android-emulator-runner@v2
                with:
                    api-level: ${{ matrix.api-level }}
                    target: ${{ matrix.target }}
                    arch: ${{ matrix.arch }}
                    force-avd-creation: false
                    emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                    disable-animations: true
                    script: |
                        adb devices
                        ./gradlew connectedAndroidTest --continue --stacktrace

            -   name: Module-wise test summary
                if: always()
                shell: python
                run: |
                    import glob, os, collections
                    import xml.etree.ElementTree as ET

                    stats = collections.defaultdict(lambda: {"passed": 0, "failed": 0, "skipped": 0, "time": 0.0})
                    failures = []

                    pattern = "**/build/outputs/androidTest-results/**/TEST-*.xml"
                    for path in sorted(glob.glob(pattern, recursive=True)):
                        module = ":" + path.split("/build/")[0].replace("/", ":")
                        try:
                            root = ET.parse(path).getroot()
                        except ET.ParseError:
                            continue
                        for tc in root.iter("testcase"):
                            s = stats[module]
                            s["time"] += float(tc.get("time") or 0)
                            bad = tc.find("failure")
                            if bad is None:
                                bad = tc.find("error")
                            if bad is not None:
                                s["failed"] += 1
                                msg = (bad.get("message") or bad.text or "").strip().splitlines()
                                failures.append((module, f'{tc.get("classname")}.{tc.get("name")}', msg[0][:200] if msg else ""))
                            elif tc.find("skipped") is not None:
                                s["skipped"] += 1
                            else:
                                s["passed"] += 1

                    lines = ["## Instrumented tests by module (API ${{ matrix.api-level }})", ""]
                    if not stats:
                        lines.append("_No test result files found._")
                    else:
                        lines += ["| Module | Status | Total | Passed | Failed | Skipped | Time |",
                                  "|---|:-:|--:|--:|--:|--:|--:|"]
                        tot = {"passed": 0, "failed": 0, "skipped": 0, "time": 0.0}
                        for module in sorted(stats):
                            s = stats[module]
                            total = s["passed"] + s["failed"] + s["skipped"]
                            icon = "❌" if s["failed"] else "✅"
                            lines.append(f'| `{module}` | {icon} | {total} | {s["passed"]} | {s["failed"]} | {s["skipped"]} | {s["time"]:.1f}s |')
                            for k in tot:
                                tot[k] += s[k]
                        total = tot["passed"] + tot["failed"] + tot["skipped"]
                        all_icon = "❌" if tot["failed"] else "✅"
                        lines.append(f'| **All modules** | {all_icon} | **{total}** | **{tot["passed"]}** | **{tot["failed"]}** | **{tot["skipped"]}** | **{tot["time"]:.1f}s** |')

                    if failures:
                        lines += ["", "<details><summary>Failed tests</summary>", "",
                                  "| Module | Test | Message |", "|---|---|---|"]
                        for module, name, msg in failures:
                            safe_msg = msg.replace("|", "\\|")
                            lines.append(f'| `{module}` | `{name}` | {safe_msg} |')
                        lines += ["", "</details>"]

                    with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                        f.write("\n".join(lines) + "\n")

            -   name: Upload test reports
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: androidTest-reports-api${{ matrix.api-level }}
                    path: |
                        **/build/reports/androidTests/
                        **/build/outputs/androidTest-results/
                    if-no-files-found: ignore

            -   name: Publish test results
                if: always()
                uses: EnricoMi/publish-unit-test-result-action@v2
                with:
                    files: |
                        **/build/test-results/**/*.xml
                        **/build/outputs/androidTest-results/**/*.xml
                    check_name: Instrumented Test Results (API ${{ matrix.api-level }})
