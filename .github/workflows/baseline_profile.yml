name: Baseline Profile & Macro benchmark

on:
    workflow_dispatch:
    pull_request:
        branches: [ main ]
        paths:
            - 'app/**'
            - 'feature/**'
            - 'core/**'
            - 'data/**'
            - 'baselineprofile/**'
            - 'benchmark/**'
            - 'gradle/**'
            - '.github/workflows/baseline_profile.yml'

permissions:
    contents: read

concurrency:
    group: baseline-profile-${{ github.ref }}
    cancel-in-progress: true

jobs:
    baseline-profile:
        runs-on: ubuntu-latest
        timeout-minutes: 90

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Set up Gradle (with caching)
                uses: gradle/actions/setup-gradle@v4

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Enable KVM
                run: |
                    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                    sudo udevadm control --reload-rules
                    sudo udevadm trigger --name-match=kvm

            # Uses the `pixel6Api37` Gradle Managed Device declared by :baselineprofile.
            # mergeIntoMain writes the merged profile to app/src/main/generated/baselineProfiles.
            -   name: Generate baseline profile
                run: ./gradlew :app:generateBaselineProfile --stacktrace

            -   name: Verify the committed profile is present
                run: |
                    if ! ls app/src/main/generated/baselineProfiles/* >/dev/null 2>&1; then
                      echo "::error::No baseline profile was generated into app/src/main/generated/baselineProfiles."
                      exit 1
                    fi

            -   name: Warn on baseline profile drift
                run: |
                    if ! git diff --quiet -- app/src/main/generated/baselineProfiles; then
                      echo "::warning::The generated baseline profile differs from the committed one; commit the updated profile."
                      git --no-pager diff --stat -- app/src/main/generated/baselineProfiles
                    fi

            -   name: Upload generated profile
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: baseline-profile
                    path: app/src/main/generated/baselineProfiles
                    if-no-files-found: warn
